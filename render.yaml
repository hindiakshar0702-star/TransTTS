# Render blueprint: web service + managed Postgres.
#
# Render runs the container as a long-lived process, which this app requires —
# transcription continues in the background after the HTTP response returns,
# uploads are written to disk, and yt-dlp is spawned as a child process. None
# of that survives on a serverless platform.
#
# Deploy: push this file, then "New +" -> "Blueprint" in the Render dashboard.
# Secrets marked sync:false must be filled in there; they are never committed.

databases:
  - name: transtts-db
    databaseName: transtts
    plan: free # upgrade before real traffic — the free tier expires
    postgresMajorVersion: "16"

services:
  - type: web
    name: transtts
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # free tier sleeps and has no persistent disk
    region: singapore # closest to the primary audience; change if needed
    healthCheckPath: /api/health
    autoDeploy: true

    # NEXT_PUBLIC_APP_URL is inlined during the build, so it must be a build
    # argument. It has to be the FULL origin including https:// — Render's
    # `fromService property: host` returns only the bare hostname, which would
    # break canonical/OG URLs. Set it by hand in the dashboard: your service is
    # served at https://<service-name>.onrender.com (e.g.
    # https://transtts.onrender.com), or your custom domain.
    dockerBuildArgs:
      NEXT_PUBLIC_APP_URL:
        sync: false

    # TTS clips are read back from disk after they are generated, so this
    # directory has to outlive a deploy. Uploads are scratch and stay ephemeral.
    disk:
      name: transtts-media
      mountPath: /app/generated
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: transtts-db
          property: connectionString
      # Prisma migrations need a direct (non-pooled) connection.
      - key: DIRECT_URL
        fromDatabase:
          name: transtts-db
          property: connectionString

      # Full origin, e.g. https://transtts.onrender.com. Set by hand — Render's
      # fromService `host` is scheme-less, and these must match the deployed
      # URL exactly or OAuth callbacks and canonical URLs break. Set
      # NEXT_PUBLIC_APP_URL to the SAME value you gave the build argument above.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_URL
        sync: false

      # Session signing key — generated once by Render, never in the repo.
      - key: AUTH_SECRET
        generateValue: true

      # --- Secrets to fill in the dashboard ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Whisper transcription. Groq has a free tier; either one works.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # --- Optional ---
      # Email delivery for OTP, password reset and the contact form. Without a
      # transport these messages are only logged, so users never receive them.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_TO
        sync: false
      # Search Console verification token ("HTML tag" method).
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
